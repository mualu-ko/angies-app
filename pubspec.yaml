name: angies_app
description: Medication adherence and pharmacovigilance app for patients on oral anticancer therapy.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Real alarms: exact scheduling, alarm sound stream, full-screen alarm.
  # Flutter 3.41+ resolves to the newest 5.x; older Flutter resolves to 5.4.1.
  alarm: ^5.4.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
